name: Configure production staff key
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Configure missing production STAFF_AUTH_HMAC_KEY without rotation
        required: true
        type: choice
        options:
          - configure-production-staff-key
permissions:
  contents: read
  actions: read
concurrency:
  group: cloudflare-production
  cancel-in-progress: false
jobs:
  configure:
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'configure-production-staff-key'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require current successfully deployed main
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data: main } = await github.rest.git.getRef({ owner, repo, ref: 'heads/main' });
            if (main.object.sha !== context.sha) throw new Error('Dispatch must target current main.');
            const { data } = await github.rest.actions.listWorkflowRuns({ owner, repo, workflow_id: 'ci.yml', head_sha: context.sha, event: 'push', status: 'success', per_page: 20 });
            let deployed = false;
            for (const run of data.workflow_runs) {
              if (run.head_sha !== context.sha || run.conclusion !== 'success') continue;
              const { data: jobs } = await github.rest.actions.listJobsForWorkflowRun({ owner, repo, run_id: run.id, per_page: 100 });
              if (jobs.jobs.some(job => job.name === 'Deploy verified main to production' && job.conclusion === 'success')) { deployed = true; break; }
            }
            if (!deployed) throw new Error('Current main must have a successful production deployment first.');
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure missing production staff throttle key
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node tools/configure-staff-key.mjs
